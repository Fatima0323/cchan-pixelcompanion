<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Claude 娘</title>
<style>
  :root { --ink:#2b1a14; --paper:#fffaf2; --orange:#e3692c; --muted:#8a6a5a; --line:#e9dccb; }
  * { box-sizing: border-box; }
  body { margin:0; width: 340px; background: var(--paper); color: var(--ink);
    font: 12px/1.5 ui-monospace, Menlo, "PingFang SC", "Microsoft YaHei", monospace; }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; background: var(--ink); color: var(--paper); }
  header img { width:28px; height:28px; image-rendering: pixelated; }
  header b { font-size:13px; }
  header .st { margin-left:auto; padding:1px 6px; background: var(--orange); font-size:11px; }
  section { padding:10px 12px; border-bottom: 2px solid var(--line); }
  h3 { margin:0 0 6px; font-size:12px; color: var(--orange); }
  label.row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0; }
  input[type=range] { width: 130px; accent-color: var(--orange); }
  input[type=number] { width: 56px; }
  input[type=text], textarea { width:100%; font: 11px ui-monospace, monospace; border: 2px solid var(--ink); padding:4px; background:#fff; }
  textarea { height: 54px; resize: vertical; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  button { font: inherit; padding:3px 8px; background: #fff; color: var(--ink); border: 2px solid var(--ink); cursor:pointer;
    box-shadow: 2px 2px 0 var(--ink); }
  button:active { transform: translate(2px,2px); box-shadow:none; }
  button.primary { background: var(--orange); color:#fff; }
  .hint { color: var(--muted); font-size: 11px; margin: 4px 0 0; }
  .sprite-row { display:grid; grid-template-columns: 58px 1fr 38px 38px; gap:4px; align-items:center; margin:4px 0; }
  .sprite-row input[type=number] { width: 100%; min-width:0; }
  .sprite-row input[type=file] { width: 100%; min-width:0; font-size: 10px; overflow:hidden; }
  .sprite-head { font-size: 10px; color: var(--muted); }
  .sprite-row .name { font-weight: bold; }
  .sprite-row .ok { color: #3d8a4a; }
  .thumbs { display:flex; gap:4px; flex-wrap: wrap; margin-top:6px; }
  .thumbs img { height: 48px; image-rendering: pixelated; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/8px 8px; border:1px solid var(--line); }
  details summary { cursor:pointer; color: var(--orange); font-weight:bold; }
  .status { font-size:11px; color: var(--muted); white-space: pre-wrap; }
.pool { margin: 6px 0; padding: 6px; border: 2px solid var(--line); background:#fff; }
  .pool-head { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .pool-head b { color: var(--orange); }
  .pool-head .rand { margin-left:auto; font-size:11px; padding:1px 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { display:inline-flex; align-items:center; gap:3px; padding:1px 4px 1px 2px; border:1px solid var(--line); background: var(--paper); }
  .chip.off { opacity:.45; }
  .chip button { padding:0 4px; box-shadow:none; border-width:1px; font-size:10px; }
  .chip.playing { border-color: var(--orange); background:#ffe8da; }
  .seg { display:inline-flex; border:2px solid var(--line); }
  .seg label { display:inline-flex; align-items:center; gap:3px; padding:1px 8px; cursor:pointer; }
  .seg label + label { border-left:2px solid var(--line); }
  .seg input { display:none; }
  .seg label.on { background: var(--orange); color:#fff; }
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <b>Claude 娘 · 像素陪伴</b>
  <span class="st" id="st">…</span>
</header>

<section>
  <label class="row">启用 <input type="checkbox" id="enabled"></label>
  <div class="row">陪你盯着
    <span class="seg" id="siteSeg">
      <label><input type="radio" name="site" value="claude"> Claude</label>
      <label><input type="radio" name="site" value="deepseek"> DeepSeek</label>
    </span>
  </div>
  <div class="hint" id="siteHint"></div>
  <label class="row">在所有网页上显示 <input type="checkbox" id="everywhere"></label>
  <div class="hint" id="everyHint">关掉后只在 claude.ai 上出现；打开后逛别的网页时她也在，状态跟着 claude.ai 走</div>
  <label class="row">显示对话框 <input type="checkbox" id="showBubble"></label>
  <p class="hint" style="margin:-2px 0 4px">关掉后平时不显示，只在需要你确认时出现。</p>
  <label class="row">大小 <input type="range" id="height" min="100" max="360" step="10"></label>
  <div class="btns" style="margin-top:6px">
    <button data-test="working">演示：工作中</button>
    <button data-test="confirm">演示：需确认</button>
    <button data-test="done">演示：完成</button>
    <button data-test="angry">演示：生气</button>
    <button data-test="drowsy">演示：犯困</button>
    <button data-test="sleep">演示：睡觉</button>
  </div>
</section>

<section>
  <h3>声音与通知</h3>
  <label class="row">完成时提示音 <input type="checkbox" id="sound"></label>
  <label class="row">需要确认时提示音 <input type="checkbox" id="confirmSound"></label>
  <label class="row">开始工作时轻响一下 <input type="checkbox" id="startSound"></label>
  <label class="row">音量 <input type="range" id="volume" min="0" max="1" step="0.05"></label>
  <label class="row">切到别的标签时弹系统通知 <input type="checkbox" id="notify"></label>
  <p class="hint">每类事件从勾选的音里随机挑一个，不会连着两次一样。点 ▶ 单独试听。</p>
  <div id="pools"></div>
  <label class="row" style="margin-top:8px">自定义完成音（会替代随机） <input type="file" id="soundFile" accept="audio/*" style="width:120px"></label>
  <div class="btns"><button id="soundReset">恢复随机音</button> <span class="hint" id="soundInfo"></span></div>
</section>

<section>
  <h3>形象（可替换）</h3>
  <p class="hint" style="margin-top:0">已内置 7 张立绘。想替换某个状态就上传一张 PNG（多帧动画横向排列，填帧数和每秒帧数）；不传的状态用内置立绘。</p>
  <div class="sprite-row sprite-head"><span>状态</span><span>图片</span><span>帧数</span><span>帧/秒</span></div>
  <div id="spriteRows"></div>
  <label class="row"><span>上传时自动去掉白底</span><input type="checkbox" id="stripBg" checked></label>
  <div class="thumbs" id="thumbs"></div>
  <div class="btns" style="margin-top:6px"><button id="spriteReset">全部恢复内置立绘</button></div>
</section>

<section>
  <details>
    <summary>高级：识别规则</summary>
    <p class="hint">"需要确认"按钮文字（正则，不区分大小写）：</p>
    <textarea id="confirmPattern"></textarea>
    <p class="hint">额外的确认区域 CSS 选择器（可留空）：</p>
    <input type="text" id="confirmSelector" placeholder='例如 [role="alertdialog"]'>
    <label class="row" style="margin-top:6px">完成状态保持（秒） <input type="number" id="doneHoldSec" min="2" max="120"></label>
    <label class="row">确认多久没人点就生气（秒） <input type="number" id="confirmAngrySec" min="5" max="600"></label>
    <label class="row">出错后生气多久（秒） <input type="number" id="errorHoldSec" min="2" max="60"></label>
    <label class="row">待机多久后犯困（秒） <input type="number" id="drowsyAfterSec" min="10" max="3600"></label>
    <label class="row">待机多久后睡着（分钟） <input type="number" id="sleepAfterMin" min="1" max="120"></label>
    <div class="btns"><button id="resetPos">把她放回右下角</button> <button id="resetAll">恢复默认设置</button></div>
    <p class="hint">当前页面检测：</p>
    <div class="status" id="status">（打开 AI 聊天页面后显示）</div>
  </details>
</section>

<script src="defaults.js"></script>
<script src="sounds.js"></script>
<script src="popup.js"></script>
</body>
</html>
